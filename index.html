<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ani ❤️</title>
    
    <!-- Load Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load elegant Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Font Classes */
        .font-script { font-family: 'Dancing Script', cursive; }
        .font-serif { font-family: 'Lora', serif; }

        /* Animated Pastel Gradient Background */
        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(255, 154, 158, 0.3);
            /* Floating Animation */
            animation: floatCard 6s ease-in-out infinite;
        }

        /* Hover effect for the card to feel interactive */
        .glass-card:hover {
            box-shadow: 0 15px 40px 0 rgba(255, 154, 158, 0.5);
            transform: scale(1.02);
            transition: all 0.3s ease;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Pulsing Heart Animation */
        .pulse-heart {
            color: #ff3b3b;
            filter: drop-shadow(0 0 15px rgba(255, 59, 59, 0.6));
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        
        /* Sparkle effect on the text */
        .text-glow {
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <!-- Main Card Container -->
    <main class="glass-card w-[90%] max-w-md rounded-[2rem] p-10 md:p-14 text-center relative z-10 transition-transform duration-300">
        
        <!-- Decorative Top Element: Pulsing Heart -->
        <div class="flex justify-center mb-6">
            <svg class="w-20 h-20 pulse-heart" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Greeting -->
        <h1 class="font-script text-5xl md:text-6xl text-white mb-6 text-glow tracking-wide">
            For Ani
        </h1>

        <!-- The Message -->
        <div class="font-serif text-white text-lg md:text-xl leading-relaxed space-y-4 text-glow font-medium">
            <p>
                You mean everything to me.
            </p>
            <p>
                Every moment with you is my favorite.
            </p>
        </div>

        <!-- Decorative Bottom Divider -->
        <div class="mt-8 flex items-center justify-center space-x-4 opacity-70">
            <div class="h-[1px] w-12 bg-white rounded-full"></div>
            <div class="w-2 h-2 rounded-full bg-white"></div>
            <div class="h-[1px] w-12 bg-white rounded-full"></div>
        </div>

    </main>

</body>
</html>
